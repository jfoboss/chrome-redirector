name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Проверка версии в теге
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией в manifest.json ($version)"
            exit 1
          fi
      - id: build
        run: echo "zip=$(scripts/build.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: ${{ steps.build.outputs.zip }}
      - name: Релиз на GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip }}
          generate_release_notes: true
