<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="extName"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <h1 data-i18n="optionsTitle"></h1>
    <label class="switch"><input type="checkbox" id="enabled"> <span data-i18n="enabled"></span></label>
  </header>

  <p class="hint" data-i18n-html="hint"></p>
  <p class="hint" data-i18n="permissionHint"></p>

  <table>
    <thead>
      <tr><th></th><th data-i18n="colType"></th><th data-i18n="colFrom"></th><th></th><th data-i18n="colTo"></th><th></th></tr>
    </thead>
    <tbody id="rules"></tbody>
  </table>
  <p id="empty" class="empty" data-i18n="emptyState" hidden></p>

  <div class="actions">
    <button id="add" data-i18n="addRule"></button>
    <button id="save" class="primary" data-i18n="save"></button>
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="export" data-i18n="exportRules"></button>
    <button id="import" data-i18n="importRules"></button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>

  <details>
    <summary data-i18n="typesSummary"></summary>
    <ul>
      <li data-i18n-html="typesExact"></li>
      <li data-i18n-html="typesDomain"></li>
      <li data-i18n-html="typesPrefix"></li>
      <li data-i18n-html="typesRegex"></li>
    </ul>
  </details>

  <script type="module" src="i18n.js"></script>
  <script type="module" src="options.js"></script>
</body>
</html>
