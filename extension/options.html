<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="extName"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <h1 data-i18n="optionsTitle"></h1>
    <label class="switch"><input type="checkbox" id="enabled"> <span data-i18n="enabled"></span></label>
  </header>

  <p class="hint" data-i18n-html="hint"></p>
  <p class="hint" data-i18n="permissionHint"></p>

  <table>
    <thead>
      <tr><th></th><th data-i18n="colType"></th><th data-i18n="colFrom"></th><th></th><th data-i18n="colTo"></th><th></th></tr>
    </thead>
    <tbody id="rules"></tbody>
  </table>
  <p id="empty" class="empty" data-i18n="emptyState" hidden></p>

  <div class="actions">
    <button id="add" data-i18n="addRule"></button>
    <button id="save" class="primary" data-i18n="save"></button>
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="export" data-i18n="exportRules"></button>
    <button id="import" data-i18n="importRules"></button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>

  <details>
    <summary data-i18n="typesSummary"></summary>
    <ul>
      <li data-i18n-html="typesExact"></li>
      <li data-i18n-html="typesDomain"></li>
      <li data-i18n-html="typesPrefix"></li>
      <li data-i18n-html="typesRegex"></li>
    </ul>
  </details>

  <dialog id="accessDialog">
    <h2 data-i18n="accessTitle"></h2>
    <p data-i18n="accessIntro"></p>
    <ul id="accessSites"></ul>
    <p data-i18n="accessWhy"></p>
    <p class="hint"><a href="https://github.com/jfoboss/chrome-redirector/blob/main/store/PRIVACY.md" target="_blank" rel="noopener" data-i18n="accessPrivacy"></a></p>
    <div class="dialog-actions">
      <button id="accessCancel" data-i18n="cancel"></button>
      <button id="accessContinue" class="primary" data-i18n="accessContinue"></button>
    </div>
  </dialog>

  <dialog id="importDialog">
    <h2 data-i18n="importTitle"></h2>
    <p data-i18n="importIntro"></p>
    <table class="conflicts">
      <thead><tr><th data-i18n="colFrom"></th><th data-i18n="importCurrent"></th><th data-i18n="importFromFile"></th><th data-i18n="importReplace"></th></tr></thead>
      <tbody id="importConflicts"></tbody>
    </table>
    <div class="dialog-actions">
      <button id="importCancel" data-i18n="importCancel"></button>
      <button id="importApply" class="primary" data-i18n="importApply"></button>
    </div>
  </dialog>

  <script type="module" src="i18n.js"></script>
  <script type="module" src="options.js"></script>
</body>
</html>
